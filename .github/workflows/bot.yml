name: Infinite Aternos Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Setup Node.js & Auto-Install
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm' # Гитхаб сам проверит package.json и мгновенно развернет библиотеки

    - name: Run Bot Node.js
      env:
        ATERNOS_IP: ${{ secrets.ATERNOS_IP }}
        ATERNOS_PORT: ${{ secrets.ATERNOS_PORT }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: node index.js


    - name: Run Bot Node.js
      run: node index.js
