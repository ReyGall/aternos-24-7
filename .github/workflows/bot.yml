name: Infinite Aternos Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Убрали строчку cache, чтобы гитхаб не ругался на отсутствие файлов

    - name: Quick Install
      # Флаг --no-audit отключает долгие проверки безопасности и ставит всё мгновенно
      run: npm install --no-audit 

    - name: Run Bot Node.js
      env:
        ATERNOS_IP: ${{ secrets.ATERNOS_IP }}
        ATERNOS_PORT: ${{ secrets.ATERNOS_PORT }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: node index.js
